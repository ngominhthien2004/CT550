<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="800" viewBox="0 0 1700 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fff8"/>
      <stop offset="0.48" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .font { font-family: "Segoe UI", Arial, sans-serif; font-weight: 800; }
      .title { font-size: 36px; fill: #064e3b; }
      .section { font-size: 28px; }
      .label { font-size: 22px; fill: #111827; }
      .small { font-size: 20px; fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrowBlue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1700" height="800" rx="28" fill="url(#bg)"/>

  <g class="font">
    <text x="850" y="58" text-anchor="middle" class="title">Luồng gợi ý người dùng trên Trang chủ</text>

    <!-- Frontend Panel -->
    <rect x="50" y="125" width="760" height="620" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="430" y="170" text-anchor="middle" class="section" fill="#166534">Frontend</text>

    <!-- Frontend Block 1: Load artwork -->
    <rect x="105" y="200" width="650" height="80" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="430" y="248" text-anchor="middle" class="label">Trang chủ tải dữ liệu artwork</text>

    <!-- Frontend Arrow 1 -->
    <line x1="430" y1="280" x2="430" y2="310" class="arrow"/>

    <!-- Frontend Block 2: Call API -->
    <rect x="105" y="310" width="650" height="80" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="430" y="358" text-anchor="middle" class="label">Gọi API gợi ý người dùng</text>

    <!-- Frontend Arrow 2 -->
    <line x1="430" y1="390" x2="430" y2="420" class="arrow"/>

    <!-- Frontend Block 3: Success -->
    <rect x="105" y="420" width="650" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="430" y="460" text-anchor="middle" class="label" fill="#1e40af">Nếu API trả kết quả</text>
    <text x="430" y="490" text-anchor="middle" class="small">→ Hiển thị danh sách gợi ý (avatar, tên, số tác phẩm)</text>

    <!-- Frontend Arrow 3 -->
    <line x1="430" y1="510" x2="430" y2="540" class="arrow"/>

    <!-- Frontend Block 4: Fallback -->
    <rect x="105" y="540" width="650" height="120" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="430" y="580" text-anchor="middle" class="label" fill="#9a3412">Nếu API trả rỗng hoặc lỗi</text>
    <text x="430" y="615" text-anchor="middle" class="small">→ Đếm artwork theo từng tác giả</text>
    <text x="430" y="645" text-anchor="middle" class="small">→ Gợi ý 9 người nhiều tác phẩm nhất</text>

    <!-- Backend Panel -->
    <rect x="890" y="125" width="760" height="620" rx="16" fill="#f8fbff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1270" y="170" text-anchor="middle" class="section" fill="#1d4ed8">Backend</text>

    <!-- Backend Block 1: Receive request -->
    <rect x="950" y="200" width="640" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="1270" y="248" text-anchor="middle" class="label" fill="#1e40af">Nhận yêu cầu (cần đăng nhập)</text>

    <!-- Backend Arrow 1 -->
    <line x1="1270" y1="280" x2="1270" y2="310" class="arrow"/>

    <!-- Backend Block 2: Algorithm -->
    <rect x="950" y="310" width="640" height="180" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text x="1270" y="350" text-anchor="middle" class="label" fill="#6b21a8">Thuật toán lọc cộng đồng</text>
    <text x="1270" y="385" text-anchor="middle" class="small">Dựa trên đồ thị theo dõi:</text>
    <text x="990" y="420" class="small">• Bạn theo dõi A và B</text>
    <text x="990" y="450" class="small">• Cả A và B đều theo dõi C</text>
    <text x="990" y="480" class="small">→ Gợi ý C cho bạn (điểm = số người chung)</text>

    <!-- Backend Arrow 2 -->
    <line x1="1270" y1="490" x2="1270" y2="520" class="arrow"/>

    <!-- Backend Block 3: Empty check -->
    <rect x="950" y="520" width="640" height="80" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="1270" y="568" text-anchor="middle" class="label" fill="#92400e">Nếu chưa theo dõi ai → trả rỗng</text>

    <!-- Backend Arrow 3 -->
    <line x1="1270" y1="600" x2="1270" y2="630" class="arrow"/>

    <!-- Backend Block 4: Return -->
    <rect x="950" y="630" width="640" height="80" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="1270" y="678" text-anchor="middle" class="label" fill="#166534">Trả kết quả về frontend</text>

    <!-- Connection arrows between panels -->
    <path d="M755 350 C815 350, 875 240, 950 240" class="arrowBlue"/>
    <path d="M950 670 C820 670, 835 480, 755 480" class="dash"/>
  </g>
</svg>