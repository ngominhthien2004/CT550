<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1765" viewBox="0 0 1500 1765">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fff8"/>
      <stop offset="0.46" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .font { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 800; fill: #064e3b; }
      .section { font-size: 28px; font-weight: 800; }
      .label { font-size: 25px; font-weight: 700; fill: #111827; }
      .small { font-size: 20px; font-weight: 500; fill: #111827; }
      .tiny { font-size: 20px; font-weight: 500; fill: #111827; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 17px; fill: #1e293b; }
      .arrow { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrowBlue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1765" rx="28" fill="url(#bg)"/>

  <g class="font">
    <text x="750" y="60" text-anchor="middle" class="title">Luồng xử lý AI Chatbot</text>
    

    <rect x="60" y="125" width="1380" height="255" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="750" y="168" text-anchor="middle" class="section" fill="#166534">Frontend</text>

    <rect x="135" y="205" width="500" height="115" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="385" y="270" text-anchor="middle" class="label">Giao diện trò chuyện</text>
    

    <rect x="865" y="205" width="380" height="115" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="1055" y="270" text-anchor="middle" class="label">Gửi yêu cầu HTTP</text>
    

    <line x1="635" y1="262" x2="855" y2="262" class="arrowBlue"/>
    <line x1="750" y1="380" x2="750" y2="445" class="arrow"/>

    <rect x="60" y="445" width="1380" height="1195" rx="14" fill="#f8fbff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="750" y="492" text-anchor="middle" class="section" fill="#1d4ed8">Backend</text>

    <rect x="150" y="525" width="1200" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="750" y="568" text-anchor="middle" class="label" fill="#1e40af">Xác thực JWT</text>
    <line x1="750" y1="595" x2="750" y2="645" class="arrow"/>

    <rect x="215" y="645" width="1070" height="86" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="750" y="700" text-anchor="middle" class="label">Lấy thông tin người dùng</text>
   
    <line x1="750" y1="731" x2="750" y2="790" class="arrow"/>

    <rect x="405" y="790" width="700" height="150" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="750" y="828" text-anchor="middle" class="label" fill="#92400e">Chọn công cụ (khớp từ khóa trong câu hỏi)</text>
    <text x="750" y="865" text-anchor="middle" class="tiny">"tìm", "search", "tìm kiếm" → Công cụ Tìm kiếm</text>
    <text x="750" y="892" text-anchor="middle" class="tiny">"gợi ý", "đề xuất", "recommend" → Công cụ Gợi ý</text>
    <text x="750" y="919" text-anchor="middle" class="tiny">Còn lại → trò chuyện tự do trực tiếp với AI</text>

    <path d="M750 940 C750 975, 430 965, 430 1025" class="arrow"/>
    <path d="M750 940 C750 975, 1070 965, 1070 1025" class="arrow"/>

    <rect x="245" y="1025" width="450" height="245" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.3"/>
    <text x="430" y="1063" text-anchor="middle" class="label" fill="#166534">Công cụ Tìm kiếm</text>
    <text x="275" y="1101" class="small">So khớp từ khóa với dữ liệu:</text>
    <text x="295" y="1135" class="tiny">• Tác phẩm: tiêu đề, thẻ</text>
    <text x="295" y="1163" class="tiny">• Người dùng: tên tài khoản, tên hiển thị</text>
    <text x="295" y="1191" class="tiny">• Kế hoạch ủy thác: tiêu đề</text>
    <text x="275" y="1231" class="small">Trả về: tác phẩm, người dùng, kế hoạch, thẻ</text>

    <rect x="885" y="1025" width="450" height="245" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2.3"/>
    <text x="1070" y="1063" text-anchor="middle" class="label" fill="#9a3412">Công cụ Gợi ý</text>
    <text x="915" y="1101" class="small">Dựa trên tác phẩm đã đánh dấu:</text>
    <text x="935" y="1135" class="tiny">• Đọc thẻ của tác phẩm đã đánh dấu</text>
    <text x="935" y="1163" class="tiny">• Chọn 5 thẻ phổ biến</text>
    <text x="935" y="1191" class="tiny">• Tìm tác phẩm có cùng thẻ</text>
    <text x="915" y="1231" class="small">Sắp xếp theo lượt thích</text>

    <path d="M430 1270 C430 1320, 750 1310, 750 1360" class="arrow"/>
    <path d="M1070 1270 C1070 1320, 750 1310, 750 1360" class="arrow"/>

    <rect x="185" y="1360" width="1130" height="105" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="750" y="1420" text-anchor="middle" class="label" fill="#3730a3">Tạo khung hội thoại cá nhân hóa</text>
    
    <line x1="750" y1="1465" x2="750" y2="1515" class="arrow"/>

    <rect x="185" y="1515" width="1130" height="95" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="750" y="1550" text-anchor="middle" class="label" fill="#1d4ed8">Gọi mô hình AI</text>
    <text x="750" y="1581" text-anchor="middle" class="small">Có kết quả truy vấn → gửi kết quả để AI giải thích | Không có → gửi câu hỏi trực tiếp cho AI</text>

    <line x1="750" y1="1610" x2="750" y2="1667" class="arrow"/>
  </g>

  <g class="font" transform="translate(90 1667)">
    <rect x="0" y="0" width="1320" height="78" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
    <text x="660" y="40" text-anchor="middle" class="label" fill="#78350f">Deepseek</text>
    
  </g>

  <g class="font">
    
    <path d="M1410 1707 C1470 1707, 1470 260, 1245 260" class="dash"/>
    <text x="1448" y="984" transform="rotate(90 1448 984)" text-anchor="middle" class="label">Gửi kết quả về giao diện người dùng</text>
  </g>
</svg>
