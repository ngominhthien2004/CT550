<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fff8"/>
      <stop offset="0.48" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .font { font-family: "Segoe UI", Arial, sans-serif; font-weight: 800; }
      .title { font-size: 36px; fill: #064e3b; }
      .subtitle { font-size: 18px; fill: #334155; }
      .section { font-size: 28px; }
      .label { font-size: 22px; fill: #111827; }
      .small { font-size: 17px; fill: #334155; }
      .arrow { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrowBlue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="920" rx="28" fill="url(#bg)"/>

  <g class="font">
    <!-- Title -->
    <text x="900" y="58" text-anchor="middle" class="title">Các kịch bản gợi ý người dùng</text>
    <text x="900" y="90" text-anchor="middle" class="subtitle">Lọc cộng đồng · Trạng thái rỗng · Tương tác theo dõi</text>

    <!-- ====== Section 1: Follow-graph recommendation ====== -->
    <rect x="45" y="120" width="1710" height="380" rx="18" fill="#f8fbff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="900" y="162" text-anchor="middle" class="section" fill="#1d4ed8">1. Lọc cộng đồng dựa trên đồ thị theo dõi</text>

    <!-- Left: Visual diagram (A, X, Y, Z, W) -->
    <g transform="translate(105 195)">
      <rect x="0" y="0" width="420" height="275" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.3"/>
      <text x="210" y="34" text-anchor="middle" class="label" fill="#166534">Đồ thị theo dõi</text>
      <circle cx="80" cy="100" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
      <text x="80" y="108" text-anchor="middle" class="label">A</text>
      <circle cx="225" cy="65" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
      <text x="225" y="73" text-anchor="middle" class="label">X</text>
      <text x="225" y="116" text-anchor="middle" class="small">fantasy</text>
      <circle cx="225" cy="180" r="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2"/>
      <text x="225" y="188" text-anchor="middle" class="label">Y</text>
      <text x="225" y="231" text-anchor="middle" class="small">sci-fi</text>
      <circle cx="350" cy="122" r="34" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
      <text x="350" y="130" text-anchor="middle" class="label">Z</text>
      <text x="350" y="173" text-anchor="middle" class="small">fantasy</text>
      <circle cx="350" cy="240" r="30" fill="#fce7f3" stroke="#db2777" stroke-width="2.2"/>
      <text x="350" y="248" text-anchor="middle" class="label">W</text>
      <line x1="114" y1="92" x2="184" y2="72" class="arrowBlue"/>
      <line x1="112" y1="116" x2="184" y2="166" class="arrowBlue"/>
      <line x1="258" y1="80" x2="317" y2="106" class="arrow"/>
      <line x1="259" y1="168" x2="317" y2="136" class="arrow"/>
      <line x1="250" y1="89" x2="326" y2="216" class="dash"/>
    </g>

    <!-- Center: Plain explanation -->
    <g transform="translate(575 195)">
      <rect x="0" y="0" width="520" height="275" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2.3"/>
      <text x="260" y="34" text-anchor="middle" class="label" fill="#1d4ed8">Cách tính điểm</text>
      <text x="40" y="78" class="label">Tìm những người mà X và Y đang theo dõi</text>
      <rect x="40" y="100" width="440" height="60" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="260" y="138" text-anchor="middle" class="label">Z được 2 người follow → điểm = 2</text>
      <rect x="40" y="180" width="440" height="60" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
      <text x="260" y="218" text-anchor="middle" class="label">W được 1 người follow → điểm = 1</text>
    </g>

    <!-- Right: Ranking result -->
    <g transform="translate(1145 195)">
      <rect x="0" y="0" width="500" height="275" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2.3"/>
      <text x="250" y="34" text-anchor="middle" class="label" fill="#9a3412">Kết quả xếp hạng</text>
      <rect x="50" y="60" width="400" height="70" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      <text x="250" y="102" text-anchor="middle" class="label">Z xếp hạng cao nhất (2 điểm)</text>
      <rect x="50" y="150" width="400" height="95" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
      <text x="250" y="182" text-anchor="middle" class="label" fill="#166534">Hiển thị card:</text>
      <text x="250" y="212" text-anchor="middle" class="small">ảnh đại diện · Tên · @username · 15 tác phẩm</text>
      <text x="250" y="235" text-anchor="middle" class="small">Nút theo dõi</text>
    </g>

    <!-- Arrows between blocks -->
    <path d="M525 332 L570 332" class="arrow"/>
    <path d="M1095 332 L1140 332" class="arrow"/>

    <!-- ====== Section 2: Empty state ====== -->
    <rect x="45" y="535" width="1710" height="355" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="900" y="577" text-anchor="middle" class="section" fill="#166534">2. Trạng thái rỗng — chưa theo dõi ai</text>

    <!-- Step 1: User hasn't followed anyone -->
    <rect x="115" y="610" width="340" height="80" rx="13" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="285" y="648" text-anchor="middle" class="label">User A chưa theo dõi ai</text>
    <text x="285" y="675" text-anchor="middle" class="small">Backend trả rỗng</text>

    <!-- Arrow 1→2 -->
    <path d="M455 650 L510 650" class="arrow"/>

    <!-- Step 2: Frontend counts artwork -->
    <rect x="515" y="610" width="380" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="705" y="648" text-anchor="middle" class="label" fill="#1d4ed8">Frontend tự đếm artwork</text>
    <text x="705" y="675" text-anchor="middle" class="small">Từ feed chính, đếm theo từng tác giả</text>

    <!-- Arrow 2→3 -->
    <path d="M895 650 L950 650" class="arrow"/>

    <!-- Step 3: Suggest top 9 -->
    <rect x="955" y="610" width="340" height="80" rx="13" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="1125" y="648" text-anchor="middle" class="label" fill="#9a3412">Gợi ý 9 người</text>
    <text x="1125" y="675" text-anchor="middle" class="small">Nhiều tác phẩm nhất</text>

    <!-- Arrow 3→4 -->
    <path d="M1295 650 L1350 650" class="arrow"/>

    <!-- Step 4: Display card list -->
    <rect x="1355" y="610" width="355" height="80" rx="13" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="1532" y="648" text-anchor="middle" class="label" fill="#9d174d">Hiển thị danh sách card</text>
    <text x="1532" y="675" text-anchor="middle" class="small">avatar · tên · @username · tác phẩm · nút theo dõi</text>

  </g>
</svg>
