<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fff8"/>
      <stop offset="0.52" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .font { font-family: "Segoe UI", Arial, sans-serif; font-weight: 800; }
      .title { font-size: 36px; fill: #064e3b; }
      .subtitle { font-size: 18px; fill: #334155; }
      .section { font-size: 27px; fill: #1d4ed8; }
      .label { font-size: 23px; fill: #111827; }
      .small { font-size: 20px; fill: #334155; }
      .tiny { font-size: 15px; fill: #475569; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 16px; font-weight: 800; fill: #1e293b; }
      .arrow { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrowBlue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1180" rx="28" fill="url(#bg)"/>

  <g class="font">
    <text x="750" y="63" text-anchor="middle" class="title">Luồng AI Detection khi upload ảnh</text>
    

    <rect x="85" y="125" width="1330" height="970" rx="18" fill="#f8fbff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="750" y="172" text-anchor="middle" class="section">AI Detection Flow</text>

    <rect x="210" y="215" width="1080" height="92" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.3"/>
    <text x="750" y="253" text-anchor="middle" class="label" fill="#166534">1. Người dùng chọn file ảnh upload</text>

    <line x1="750" y1="307" x2="750" y2="365" class="arrow"/>

    <rect x="210" y="365" width="1080" height="96" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2.3"/>
    <text x="750" y="403" text-anchor="middle" class="label" fill="#1d4ed8">2. Frontend gửi ảnh đến AI Detection API</text>
    

    <line x1="750" y1="461" x2="750" y2="520" class="arrow"/>

    <rect x="210" y="520" width="1080" height="112" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.3"/>
    <text x="750" y="561" text-anchor="middle" class="label" fill="#92400e">3. Model umm-maybe/AI-image-detector phân tích ảnh</text>

    <line x1="750" y1="632" x2="750" y2="690" class="arrow"/>

    <rect x="210" y="690" width="1080" height="128" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2.3"/>
    <text x="750" y="731" text-anchor="middle" class="label" fill="#3730a3">4. Backend đọc điểm dự đoán từ HF API</text>
    <text x="750" y="765" text-anchor="middle" class="small">So sánh aiScore và realScore</text>
    <text x="750" y="795" text-anchor="middle" class="small">confidence = max(aiScore, realScore) × 100</text>

    <path d="M750 818 C750 865, 440 860, 440 920" class="arrowBlue"/>
    <path d="M750 818 C750 865, 1060 860, 1060 920" class="arrowBlue"/>

    <rect x="165" y="920" width="550" height="118" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.3"/>
    <text x="440" y="958" text-anchor="middle" class="label" fill="#166534">aiScore &gt; realScore</text>
    <text x="440" y="991" text-anchor="middle" class="small">isAI = true</text>
    <text x="440" y="1020" text-anchor="middle" class="small">Tự động gắn tag "ai"</text>

    <rect x="785" y="920" width="550" height="118" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2.3"/>
    <text x="1060" y="958" text-anchor="middle" class="label" fill="#991b1b">aiScore ≤ realScore</text>
    <text x="1060" y="991" text-anchor="middle" class="medium">isAI = false</text>
    <text x="1060" y="1020" text-anchor="middle" class="small">Không gắn tag AI</text>

    <path d="M440 1038 C440 1075, 750 1065, 750 1118" class="arrow"/>
    <path d="M1060 1038 C1060 1075, 750 1065, 750 1118" class="arrow"/>
  </g>

  <g class="font" transform="translate(165 1118)">
    <rect x="0" y="0" width="1170" height="48" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2.3"/>
    <text x="585" y="31" text-anchor="middle" class="label" fill="#9d174d">5. Frontend hiển thị kết quả trên form upload</text>
  </g>
</svg>
